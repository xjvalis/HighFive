<!--
  Supabase Auth template: Confirm signup
  Paste into: Supabase Dashboard → Authentication → Email Templates → Confirm signup
  Subject line to set there: Potvrď svůj Spoluvíc účet
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#FDFCFA;padding:40px 16px;font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;background-color:#FFFFFF;border:1px solid #F1EEE8;border-radius:16px;">
        <tr>
          <td style="padding:32px 32px 24px;">
            <table role="presentation" cellpadding="0" cellspacing="0">
              <tr>
                <td valign="middle" style="padding-right:9px;"><img src="https://spoluvic.app/icon-192.png" width="28" height="28" alt="" style="display:block;border-radius:6px;" /></td>
                <td valign="middle"><span style="font-size:17px;font-weight:600;letter-spacing:-0.03em;color:#3A343F;">Spoluvíc</span></td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px 8px;">
            <h1 style="margin:0 0 10px;font-size:19px;line-height:1.3;letter-spacing:-0.03em;color:#3A343F;font-weight:500;">Potvrď e-mail</h1>
            <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#77707C;font-weight:300;">
              Potvrď e-mailovou adresu a účet je hotový.
            </p>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:0 32px 32px;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;background-color:#FFB84D;color:#3A2A0A;text-decoration:none;font-size:14px;font-weight:600;padding:13px 32px;border-radius:999px;">
              Potvrdit e-mail
            </a>
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px 32px;">
            <p style="margin:0;font-size:12px;line-height:1.6;color:#8C8790;font-weight:300;">
              Pokud sis účet nezakládal/a, tenhle e-mail stačí ignorovat — nic se nestane.
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:18px 32px;background-color:#FDFCFA;border-top:1px solid #F1EEE8;border-radius:0 0 16px 16px;">
            <p style="margin:0;font-size:11px;line-height:1.7;color:#8C8790;text-align:center;font-weight:300;">
              Spoluvíc · Sdílej své plány s ostatními<br />
              Dotazy? <a href="mailto:podpora@spoluvic.app" style="color:#3B4FE0;text-decoration:none;">podpora@spoluvic.app</a>
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
