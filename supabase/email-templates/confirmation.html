<!--
  Supabase Auth template: Confirm signup
  Paste into: Supabase Dashboard → Authentication → Email Templates → Confirm signup
  Subject line to set there: Potvrď svůj HighFive účet
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f9f7f3;padding:40px 16px;font-family:Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;background-color:#ffffff;border-radius:20px;overflow:hidden;">
        <tr>
          <td align="center" style="padding:40px 32px 24px;">
            <img src="https://high-five-nine.vercel.app/hands.png" width="56" height="56" alt="HighFive" style="display:block;margin:0 auto 12px;" />
            <div style="font-size:22px;font-weight:700;color:#1a1a2e;">HighFive</div>
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px 8px;">
            <h1 style="margin:0 0 12px;font-size:20px;line-height:1.3;color:#1a1a2e;font-weight:700;">Vítej v partě 🙌</h1>
            <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#6b7280;">
              Ještě jeden krok a jedeme — potvrď svůj e-mail a účet je aktivní.
            </p>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:0 32px 32px;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;background-color:#7c3aed;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;padding:13px 32px;border-radius:12px;">
              Potvrdit e-mail
            </a>
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px 32px;">
            <p style="margin:0;font-size:12px;line-height:1.6;color:#9ca3af;">
              Pokud si účet nezakládal/a ty, tenhle e-mail prostě ignoruj — nic se nestane.
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 32px;background-color:#f9f7f3;border-top:1px solid #eeece6;">
            <p style="margin:0;font-size:11px;line-height:1.6;color:#9ca3af;text-align:center;">
              HighFive · Najdi lidi pro společné aktivity<br />
              Dotazy? <a href="mailto:xjvalis+highfive@gmail.com" style="color:#7c3aed;text-decoration:none;">xjvalis+highfive@gmail.com</a>
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
